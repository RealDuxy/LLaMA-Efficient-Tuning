model_name_or_path: /root/autodl-tmp/llama3-8b

# method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all
flash_attn: fa2
#print_param_status: true

## ddp
#ddp_timeout: 180000000
#deepspeed: examples/deepspeed/ds_z2_offload_config.json
#report_to: wandb

# dataset
dataset: boolq
val_size: 0.01
template: llama3
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 16
packing: false

# output
output_dir: /root/autodl-tmp/checkpoints/llama3 /0805-llama3-8b-lora-boolq-exp1
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

# train
per_device_train_batch_size: 4
gradient_accumulation_steps: 16
learning_rate: 0.0002
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 0.1
bf16: true

# eval
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 70
