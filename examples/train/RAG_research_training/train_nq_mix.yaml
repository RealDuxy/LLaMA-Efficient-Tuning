model_name_or_path: /root/autodl-tmp/llama3-8b
adapter_name_or_path: /root/autodl-tmp/checkpoints/llama3/0805-llama3-8b-lora-alpaca-exp1

# method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj,k_proj,o_proj
flash_attn: fa2
#print_param_status: true

## ddp
#ddp_timeout: 180000000
#deepspeed: examples/deepspeed/ds_z2_offload_config.json
#report_to: wandb

# dataset
dataset: nq_bm25_top100_kilt,alpaca_en
max_samples: 8500
eval_dataset: nq_bm25_top100_kilt
template: llama3
cutoff_len: 1800
overwrite_cache: true
preprocessing_num_workers: 16
packing: false
resize_vocab: true

# output
output_dir: /root/autodl-tmp/checkpoints/llama3/0805-llama3-8b-lora-alpaca-nq-mix-exp1
logging_steps: 5
save_steps: 320
plot_loss: true
overwrite_output_dir: true

# train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 0.1
bf16: true

# eval
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 160
